name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Falha o pipeline em vulnerabilidade alta/crítica (moderadas não bloqueiam).
      - name: Auditoria de dependências
        run: npm run audit:ci

      - name: Lint + formatação (Biome)
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes de unidade
        run: npm test

      - name: Build
        run: npm run build

  integracao:
    name: Testes de integração (API)
    runs-on: ubuntu-latest

    # Mongo e Redis reais: um mock esconderia justamente as falhas de isolamento por cliente.
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes de integração
        run: npm run test:integration
        env:
          MONGO_URI_TEST: mongodb://localhost:27017/mailpulse_test
          REDIS_URL_TEST: redis://localhost:6379/15
          JWT_SECRET: segredo-de-ci-nao-usar-em-producao
          ENCRYPTION_KEY: chave-de-ci-nao-usar-em-producao

  commits:
    name: Padrão das mensagens de commit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Commitlint
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
