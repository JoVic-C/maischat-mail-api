# mMail — stack para o EasyPanel.
#
# Aqui só a APLICAÇÃO. O Mongo e o Redis são serviços gerenciados pelo próprio
# EasyPanel (criados pela interface), e chegam por MONGO_URI e REDIS_URL — por isso
# não existem serviços de banco neste arquivo. Se você preferir subir os dois dentro
# desta stack, use o docker-compose.yml local como base.
#
# Diferenças em relação ao compose local, todas porque o EasyPanel assume o que
# localmente é nosso:
#
#   1. NENHUMA porta publicada. Ele roteia para a porta interna e cuida de TLS.
#   2. Variáveis vêm do painel (aba Environment), não de arquivo — o `.env` é opcional.
#   3. Domínio vai no serviço `frontend`; o backend fica só na rede interna.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: '3000'

      # ── Serviços gerenciados do EasyPanel ──
      # Copie a "URL de Conexão Interna" de cada um. Dois cuidados no Mongo:
      # incluir o NOME DO BANCO no fim do host e, como o usuário é criado no banco
      # `admin`, acrescentar authSource=admin — sem isso a autenticação falha.
      #   mongodb://user:senha@outros_mongomail:27017/mmail?authSource=admin&tls=false
      MONGO_URI: ${MONGO_URI:?cole a URL de conexão interna do Mongo}
      REDIS_URL: ${REDIS_URL:?cole a URL de conexão interna do Redis}

      # ── Obrigatórias: a API encerra no boot se faltarem ──
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no painel}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?defina ENCRYPTION_KEY no painel}

      # ── Domínio real, não localhost ──
      # Vão dentro dos emails: pixel de abertura, link de clique, descadastro,
      # convite e recuperação de senha. Errado aqui, o email já enviado não se corrige.
      PUBLIC_API_URL: ${PUBLIC_API_URL:?defina a URL pública da API}
      FRONTEND_URL: ${FRONTEND_URL:?defina a URL pública do painel}

      # ── Opcionais (mesmo default do código quando ausentes) ──
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SENTRY_DSN: ${SENTRY_DSN:-}
      XMAILER_SMTP_HOST: ${XMAILER_SMTP_HOST:-}
      XMAILER_SMTP_PORT: ${XMAILER_SMTP_PORT:-587}
      # Vazia basta: a 465 usa TLS direto e as demais STARTTLS. Só preencha ('true'
      # ou 'false') para um servidor que fuja dessa convenção.
      XMAILER_SMTP_SECURE: ${XMAILER_SMTP_SECURE:-}
      XMAILER_SMTP_USER: ${XMAILER_SMTP_USER:-}
      XMAILER_SMTP_PASS: ${XMAILER_SMTP_PASS:-}
      XMAILER_FROM_NAME: ${XMAILER_FROM_NAME:-mMail}
      XMAILER_FROM_EMAIL: ${XMAILER_FROM_EMAIL:-}
      XMAILER_WEBHOOK_TOKEN: ${XMAILER_WEBHOOK_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      # Imagens dos emails e anexos das campanhas. Sem este volume, todo upload
      # é perdido a cada redeploy.
      - uploads:/app/uploads
      # CSVs de importação em processamento. Volume próprio porque, ao contrário de
      # uploads, este conteúdo NÃO pode ser servido publicamente.
      - imports:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # É este serviço que recebe o domínio no EasyPanel (porta 80). O nginx dele serve
  # o painel e faz proxy de /api e /uploads para o backend pela rede interna — por
  # isso o backend não precisa de domínio próprio nem de porta publicada.
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  uploads:
  imports:
