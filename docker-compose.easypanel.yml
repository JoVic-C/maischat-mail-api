# mMail no EasyPanel. Mongo e Redis são serviços gerenciados do próprio EasyPanel e
# chegam por MONGO_URI e REDIS_URL. Sem portas publicadas: o domínio vai no `frontend`,
# cujo nginx faz proxy de /api e /uploads para o backend pela rede interna.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: '3000'

      # URL de conexão interna. No Mongo, inclua o nome do banco e authSource=admin:
      #   mongodb://user:senha@outros_mongomail:27017/mmail?authSource=admin&tls=false
      MONGO_URI: ${MONGO_URI:?cole a URL de conexão interna do Mongo}
      REDIS_URL: ${REDIS_URL:?cole a URL de conexão interna do Redis}

      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no painel}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?defina ENCRYPTION_KEY no painel}

      # Vão dentro dos emails (pixel, cliques, descadastro, convites): email enviado com
      # URL errada não se corrige depois.
      PUBLIC_API_URL: ${PUBLIC_API_URL:?defina a URL pública da API}
      FRONTEND_URL: ${FRONTEND_URL:?defina a URL pública do painel}

      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SENTRY_DSN: ${SENTRY_DSN:-}
      XMAILER_SMTP_HOST: ${XMAILER_SMTP_HOST:-}
      XMAILER_SMTP_PORT: ${XMAILER_SMTP_PORT:-587}
      # Vazia basta: 465 usa TLS direto e as demais STARTTLS.
      XMAILER_SMTP_SECURE: ${XMAILER_SMTP_SECURE:-}
      XMAILER_SMTP_USER: ${XMAILER_SMTP_USER:-}
      XMAILER_SMTP_PASS: ${XMAILER_SMTP_PASS:-}
      XMAILER_FROM_NAME: ${XMAILER_FROM_NAME:-mMail}
      XMAILER_FROM_EMAIL: ${XMAILER_FROM_EMAIL:-}
      XMAILER_WEBHOOK_TOKEN: ${XMAILER_WEBHOOK_TOKEN:-}
      SENDING_PLATFORM_HOSTS: ${SENDING_PLATFORM_HOSTS:-}
      SENDING_SPF_INCLUDE: ${SENDING_SPF_INCLUDE:-}
      SENDING_DKIM_SELECTOR: ${SENDING_DKIM_SELECTOR:-mmail}
      SENDING_DKIM_TARGET: ${SENDING_DKIM_TARGET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - uploads:/app/uploads
      # Volume próprio: ao contrário de uploads, não pode ser servido publicamente.
      - imports:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  uploads:
  imports:
