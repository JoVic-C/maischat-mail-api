services:
  mongo:
    image: mongo:7
    container_name: mailpulse-mongo
    restart: unless-stopped
    # Só no loopback: o Mongo não tem senha e não pode ficar aberto na rede.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mailpulse_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: mailpulse-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - mailpulse_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: mailpulse-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Na rede do compose os hosts são os nomes dos serviços; sobrescrevem o localhost do .env.
      MONGO_URI: mongodb://mongo:27017/mailpulse
      REDIS_URL: redis://redis:6379
    volumes:
      - mailpulse_uploads:/app/uploads
      # Volume próprio: ao contrário de uploads, não pode ser servido publicamente.
      - mailpulse_imports:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ../frontend
    container_name: mailpulse-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

  # SMTP de teste: aceita tudo e não entrega nada. Fora do `up` padrão.
  #   docker compose --profile smtp up -d mailpit
  # Cadastre como SMTP do cliente: host `mailpit`, porta 1025, sem autenticação.
  # Caixa de entrada em http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpulse-mailpit
    profiles: ["smtp"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 50000
      MP_SMTP_MAX_RECIPIENTS: 100
      # Injeta erros SMTP, para exercitar bounce, retry e auto-pausa.
      MP_ENABLE_CHAOS: ${MAILPIT_CHAOS:-false}

volumes:
  mailpulse_mongo:
  mailpulse_redis:
  mailpulse_uploads:
  mailpulse_imports:
